# Builds all three release artifacts, checksums them and creates a DRAFT
# release. A human publishes the draft: the tag appears on GitHub only at that
# moment, so nothing this pipeline does before then is irreversible.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        # The example is deliberately not a real number: a version literal in this
        # file would become its second source, and test_version_has_exactly_one_source
        # forbids that -- rightly, since the example would drift on the next bump.
        description: "Version to release, without the leading v (for example 1.2.3)"
        required: true
        type: string

jobs:
  guard:
    runs-on: ubuntu-latest
    # Explicit rather than the repository default: the default can be generous,
    # and then a job that only needs to read would be handed write access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # The version is read from the file through the AST rather than by importing:
      # importing trimitdown drags in markitdown, which this job neither has nor needs.
      - name: Refuse a version the package does not declare
        # The input travels through the environment, not through a ${{ }} substitution:
        # substitution expands into the script text before it runs, so a $(...) inside a
        # version number would execute in the shell ahead of any check -- and would do it
        # again in the release job, where the token has contents: write.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY' > declared.txt
          import ast, pathlib
          tree = ast.parse(pathlib.Path("src/trimitdown/__init__.py").read_text(encoding="utf-8"))
          print(next(node.value.value for node in tree.body
                     if isinstance(node, ast.Assign) and node.targets[0].id == "__version__"))
          PY
          declared=$(cat declared.txt)
          test "$declared" = "$VERSION" \
            || { echo "release asked for $VERSION, the package declares $declared"; exit 1; }

      # This both refuses the build and produces the text. One step rather than a
      # check here and a copy of the same parsing in the notes step: with two,
      # the guard can pass while the notes are built from something else, which
      # is the failure this whole mechanism exists to prevent. It runs before the
      # suite because it costs nothing and the suite costs minutes.
      #
      # The version travels through the environment, not through a ${{ }}
      # substitution -- same reason as the step above, and the same token with
      # contents: write waiting downstream.
      - name: Take the description of the changes from the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/changelog_section.py "$VERSION" > changelog-section.md

      # The release job deliberately has no checkout, so the text has to travel
      # to it as an artifact rather than be read from the tree again.
      - uses: actions/upload-artifact@v7
        with:
          name: changelog-section
          path: changelog-section.md

      # Releasing a build whose tests do not pass is the one mistake this pipeline
      # cannot undo after publication. The gate is the same one tests.yml runs, not a
      # weakened copy: `pytest` returns 0 on a run where something was skipped, so the
      # zero-skips invariant used to stand exactly where the mistake is reversible and
      # was dropped where it is not.
      - name: Run the portable suite
        run: |
          # requirements-dev.lock, not requirements.lock plus a hand-typed list
          # of test tools: a second list of the same dependencies is a second
          # source that drifts, and an unpinned install in the job that gates the
          # release reopens exactly the hole this lock closes.
          python -m pip install --require-hashes -r requirements-dev.lock
          # --no-deps is load-bearing: resolving again here would bypass the lock.
          python -m pip install --no-deps -e . ./packages/trimitdown-pdf
          python -m pytest -m "not corpus" -rs --junitxml=report.xml
          python scripts/check_no_skips.py report.xml

  macos:
    needs: guard
    uses: ./.github/workflows/build-macos.yml

  windows:
    needs: guard
    uses: ./.github/workflows/build-windows.yml

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The single list of release artifacts. The completeness check, the checksums
      # and the upload all read it -- three private copies would drift apart in
      # silence, and it would only show on a published release.
      ARTIFACTS: >-
        TrimItDown-macOS-x86_64.dmg
        TrimItDown-macOS-arm64.dmg
        TrimItDown-windows-x64.exe
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: TrimItDown-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: changelog-section
          path: notes

      - name: Verify every expected artifact arrived
        run: |
          cd release
          for artifact in $ARTIFACTS; do
            test -f "$artifact" || { echo "$artifact missing from the release set"; exit 1; }
          done

      - name: Checksum every artifact
        run: |
          cd release
          sha256sum $ARTIFACTS > SHA256SUMS
          cat SHA256SUMS

      - name: Write the draft notes
        run: |
          cd release
          {
            echo "## Установка / Install"
            echo
            echo '```bash'
            echo "uv tool install trimitdown"
            echo '```'
            echo
            echo "Приложение для macOS и Windows — в файлах ниже. На macOS: открыть образ"
            echo "и перетащить TrimItDown в «Программы»."
            echo "The macOS and Windows apps are attached below. On macOS: open the disk"
            echo "image and drag TrimItDown into Applications."
            echo
            # The description of the changes, taken from CHANGELOG.md by the guard
            # job. It used to be typed in by hand here and was lost once when the
            # draft was recreated; a re-cut draft now reproduces it instead.
            cat ../notes/changelog-section.md
            echo
            echo "## SHA256"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md

      # A draft is created only from main. From a branch the run reaches this point
      # and stops: the pipeline gets exercised end to end on live runners without
      # producing release objects from unmerged code.
      - name: Create or update the draft release
        if: github.ref == 'refs/heads/main'
        env:
          # The job deliberately skips checkout -- it needs only the artifacts. But
          # then there is no .git beside it, and gh without GH_REPO fails with "not a
          # git repository": it does not read GITHUB_REPOSITORY. Verified by hand on
          # gh 2.96.0.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cd release
          # A release accumulates: the draft is cut, the artifacts are checked by
          # hand, work lands, the draft is cut again. `gh release create` fails on
          # an existing tag, so re-cutting used to mean deleting the draft first --
          # and that is exactly how the description of the changes was lost once.
          state=$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null || echo absent)

          if [ "$state" = "false" ]; then
            echo "v$VERSION is already published. Publication is the one"
            echo "irreversible direction here, so this refuses rather than"
            echo "overwriting it. Raise the version."
            exit 1
          fi

          # --target is required in both branches: without it GitHub binds the tag
          # to the tip of the default branch at the moment the draft is published.
          # The build takes a while, and a commit landing meanwhile would drag the
          # tag off the code the attached binaries were built from -- which a
          # published release no longer shows.
          if [ "$state" = "absent" ]; then
            gh release create "v$VERSION" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file notes.md \
              $ARTIFACTS SHA256SUMS
          else
            gh release edit "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file notes.md
            gh release upload "v$VERSION" $ARTIFACTS SHA256SUMS --clobber

            # --clobber replaces same-named files and nothing else. An asset from
            # an earlier cut whose name has since changed -- a dropped
            # architecture, a renamed image -- would stay attached and ship with
            # the draft, and a human approving the draft would have no way to tell
            # it apart from the rest. The expected set is $ARTIFACTS, the same list
            # the completeness check and the checksums read.
            expected=" $ARTIFACTS SHA256SUMS "
            for asset in $(gh release view "v$VERSION" --json assets -q '.assets[].name'); do
              case "$expected" in
                *" $asset "*) ;;
                *)
                  echo "removing stale asset from an earlier cut: $asset"
                  gh release delete-asset "v$VERSION" "$asset" --yes
                  ;;
              esac
            done
          fi

      - name: Report a dry run
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Not on main: artifacts built and checksummed, no release created." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS
