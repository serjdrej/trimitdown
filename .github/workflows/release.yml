# Собирает все три релизных артефакта, считает контрольные суммы и создаёт
# ЧЕРНОВИК релиза. Публикует черновик человек: тег на GitHub появляется только в
# момент публикации, поэтому до неё конвейер не делает ничего необратимого.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        # Пример намеренно не настоящий номер: literal версии в этом файле стал бы
        # её вторым источником, а test_version_has_exactly_one_source этого не
        # допускает -- и правильно делает, при подъёме версии пример бы поехал.
        description: "Version to release, without the leading v (for example 1.2.3)"
        required: true
        type: string

jobs:
  guard:
    runs-on: ubuntu-latest
    # Явно, а не по умолчанию репозитория: настройка по умолчанию может быть
    # щедрой, и тогда джобе, которой нужно только читать, достанется запись.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Версия читается из файла через AST, а не импортом: импорт trimitdown
      # тянет markitdown, которого в этой джобе нет и ставить его сюда незачем.
      - name: Refuse a version the package does not declare
        # Вход едет через окружение, а не подстановкой ${{ }}: подстановка
        # разворачивается в текст скрипта до его запуска, поэтому строка вида
        # $(...) в номере версии выполнилась бы шеллом раньше любой проверки --
        # и повторилась бы в релизной джобе, где у токена есть contents: write.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY' > declared.txt
          import ast, pathlib
          tree = ast.parse(pathlib.Path("src/trimitdown/__init__.py").read_text(encoding="utf-8"))
          print(next(node.value.value for node in tree.body
                     if isinstance(node, ast.Assign) and node.targets[0].id == "__version__"))
          PY
          declared=$(cat declared.txt)
          test "$declared" = "$VERSION" \
            || { echo "release asked for $VERSION, the package declares $declared"; exit 1; }

      # Выпустить сборку с непроходящими тестами -- единственная ошибка этого
      # конвейера, которую после публикации не отменить. Гейт тот же, что в
      # tests.yml, а не его ослабленная копия: `pytest` возвращает 0 и на
      # прогоне, где что-то скипнулось, поэтому инвариант «ноль скипов» стоял
      # ровно там, где ошибка обратима, и был снят там, где она необратима.
      - name: Run the portable suite
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -m "not corpus" -rs --junitxml=report.xml
          python scripts/check_no_skips.py report.xml

  macos:
    needs: guard
    uses: ./.github/workflows/build-macos.yml

  windows:
    needs: guard
    uses: ./.github/workflows/build-windows.yml

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Единственный список релизных артефактов. Из него берут и проверка
      # комплектности, и контрольные суммы, и загрузка -- три своих копии списка
      # разошлись бы молча, а заметно это стало бы уже на опубликованном релизе.
      ARTIFACTS: >-
        TrimItDown-macOS-x86_64.dmg
        TrimItDown-macOS-arm64.dmg
        TrimItDown-windows-x64.exe
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: TrimItDown-*
          merge-multiple: true
          path: release

      - name: Verify every expected artifact arrived
        run: |
          cd release
          for artifact in $ARTIFACTS; do
            test -f "$artifact" || { echo "$artifact missing from the release set"; exit 1; }
          done

      - name: Checksum every artifact
        run: |
          cd release
          sha256sum $ARTIFACTS > SHA256SUMS
          cat SHA256SUMS

      - name: Write the draft notes
        run: |
          cd release
          {
            echo "## Установка / Install"
            echo
            echo '```bash'
            echo "uv tool install trimitdown"
            echo '```'
            echo
            echo "Приложение для macOS и Windows — в файлах ниже. На macOS: открыть образ"
            echo "и перетащить TrimItDown в «Программы»."
            echo "The macOS and Windows apps are attached below. On macOS: open the disk"
            echo "image and drag TrimItDown into Applications."
            echo
            echo "## SHA256"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md

      # Черновик создаётся только с main. С ветки прогон доходит досюда и
      # останавливается: конвейер проверяется целиком на живых раннерах, а
      # релизных объектов от неслитого кода не возникает.
      - name: Create the draft release
        if: github.ref == 'refs/heads/main'
        env:
          # Джоба намеренно не делает checkout -- ей нужны только артефакты. Но
          # тогда рядом нет .git, а gh без GH_REPO падает с "not a git repository":
          # GITHUB_REPOSITORY он не читает. Проверено вручную на gh 2.96.0.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cd release
          # --target обязателен: без него GitHub привяжет тег к верхушке
          # default-ветки на момент публикации черновика. Сборка идёт долго, и
          # приехавший тем временем коммит увёл бы тег с того кода, из которого
          # собраны вложенные бинарники -- по опубликованному релизу это уже не
          # видно.
          gh release create "v$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            $ARTIFACTS SHA256SUMS

      - name: Report a dry run
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Not on main: artifacts built and checksummed, no release created." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS
