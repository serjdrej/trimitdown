name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets release.yml call this build instead of copying its steps: a copy would
  # drift from the original in silence, and this project has already lived through
  # spec files drifting apart.
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          # macos-14 entered deprecation on 2026-07-06 and stops working on
          # 2026-11-02; workflows still using the label are terminated with an
          # error then (actions/runner-images#13518). Moved before it expires
          # rather than after, and onto the same OS version as the Intel job so
          # the two bundles differ in architecture and nothing else.
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Explicit rather than the repository default: this build only needs to read code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The iconset is derived from mac-build/icon_master_1024.png and is not
      # committed; Pillow arrives transitively with pdfplumber.
      - name: Generate iconset
        run: python generate_iconset.py

      - name: Build .icns from iconset
        run: iconutil -c icns mac-build/AppIcon.iconset -o mac-build/AppIcon.icns

      - name: Build app with PyInstaller
        env:
          PYI_TARGET_ARCH: ${{ matrix.arch }}
        run: pyinstaller main.spec

      # A green build proves nothing about what is inside the bundle: a missing
      # module produces an app that starts fine and fails on the first PDF. Same
      # check the tiktoken_ext regression needed. Path is explicit -- PyInstaller
      # names the build directory after the spec, and a stale build/<other>/ dir
      # would make a glob answer for the wrong build.
      - name: Verify package contents are in the bundle
        run: |
          grep -q "trimitdown_pdf" build/main/Analysis-00.toc \
            || { echo "trimitdown_pdf missing from the bundle"; exit 1; }
          grep -Eq "'trimitdown(\.[A-Za-z_][A-Za-z0-9_]*)?'" build/main/Analysis-00.toc \
            || { echo "trimitdown package missing from the bundle"; exit 1; }
          grep -q "tiktoken_cache" build/main/Analysis-00.toc \
            || { echo "tiktoken cache missing from the bundle"; exit 1; }

      # The smoke document is built by the same generator as the suite's fixtures:
      # prose plus a real table, so the engine has to do its work. The module is
      # import-free -- a build job needs no dev dependencies.
      - name: Build the smoke document
        run: python -c "from tests.pdf_fixtures import ruled_table; open('smoke.pdf','wb').write(ruled_table())"

      # THIS is the check that matters, not the contents check beside it. Grepping
      # Analysis-00.toc looks at file names and cannot see the process dying on the
      # first dlopen -- which is exactly how every macOS bundle of earlier releases
      # reached users broken. Here the artifact itself runs and converts a document.
      #
      # The verdict comes from the log rather than the exit status: a windowed process
      # does not deliver that status to the shell on every platform, and the check has
      # to be identical in both jobs. The status is printed beside it as information.
      - name: Smoke-launch the bundle
        env:
          # Relative paths on purpose: on the Windows runner $PWD in bash is
          # /d/a/..., which the interpreter inside the bundle cannot open, and the
          # check has to be literally the same in both jobs.
          TRIMITDOWN_SMOKE_LOG: smoke.log
        run: |
          set +e
          TRIMITDOWN_SMOKE=smoke.pdf dist/TrimItDown.app/Contents/MacOS/TrimItDown
          status=$?
          set -e
          echo "exit status: $status"
          test -s smoke.log || { echo "the bundle produced no smoke log at all"; exit 1; }
          cat smoke.log
          tail -1 smoke.log | grep -q '^smoke ok:' \
            || { echo "the bundle did not complete a conversion"; exit 1; }

      - name: Build drag-to-install image
        run: |
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          # ditto, not cp -R: it is the tool that copies an .app faithfully --
          # symlinks, extended attributes, resource forks -- and leaves the
          # ad-hoc signature intact. cp -R produces a bundle that looks complete
          # and can fail signature validation at launch, which is the shape of
          # failure this pipeline exists to stop shipping.
          ditto dist/TrimItDown.app "$staging/TrimItDown.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "TrimItDown" \
            -srcfolder "$staging" \
            -format UDZO \
            -ov \
            TrimItDown-macOS-${{ matrix.arch }}.dmg

      - name: Verify image contents
        run: |
          mount_dir=$(mktemp -d)
          # Tolerant teardown on purpose. The app we launch from the volume can
          # still hold it for a moment after it exits, and a bare detach under
          # `set -e` then returns 16 from the EXIT trap and becomes the step's
          # verdict -- letting cleanup overrule a check that passed. What this
          # step guarantees is asserted explicitly below; unmounting is not it.
          trap 'hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "$mount_dir" \
            TrimItDown-macOS-${{ matrix.arch }}.dmg
          test -d "$mount_dir/TrimItDown.app" \
            || { echo "the image does not contain TrimItDown.app"; exit 1; }
          test -L "$mount_dir/Applications" \
            || { echo "the image does not contain an Applications link"; exit 1; }
          test "$(readlink "$mount_dir/Applications")" = "/Applications" \
            || { echo "the Applications link points somewhere else"; exit 1; }

      - name: Smoke-launch the mounted image
        env:
          TRIMITDOWN_SMOKE_LOG: smoke-mounted.log
        run: |
          mount_dir=$(mktemp -d)
          # Tolerant teardown on purpose. The app we launch from the volume can
          # still hold it for a moment after it exits, and a bare detach under
          # `set -e` then returns 16 from the EXIT trap and becomes the step's
          # verdict -- letting cleanup overrule a check that passed. What this
          # step guarantees is asserted explicitly below; unmounting is not it.
          trap 'hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "$mount_dir" \
            TrimItDown-macOS-${{ matrix.arch }}.dmg
          set +e
          TRIMITDOWN_SMOKE=smoke.pdf "$mount_dir/TrimItDown.app/Contents/MacOS/TrimItDown"
          status=$?
          set -e
          echo "exit status: $status"
          test -s smoke-mounted.log \
            || { echo "the mounted image produced no smoke log at all"; exit 1; }
          cat smoke-mounted.log
          tail -1 smoke-mounted.log | grep -q '^smoke ok:' \
            || { echo "the mounted image did not complete a conversion"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: TrimItDown-macOS-${{ matrix.arch }}
          path: TrimItDown-macOS-${{ matrix.arch }}.dmg
