# Publishes either project in this repository -- the application (trimitdown) or
# the engine (trimitdown-pdf) -- to PyPI via Trusted Publishing (OIDC).
#
# There is no API token anywhere in this repository, and there should never be
# one: PyPI hands this workflow a short-lived credential only when the OIDC
# claim matches the publisher registered on pypi.org -- this repository, this
# filename, this environment. Rename the file and publishing stops working,
# which is the intended behaviour.
#
# Deliberately `workflow_dispatch` only. No `on: release`, no tag trigger: a
# version number on PyPI is burned the moment it uploads and can never be
# reused, so the workflow must not be reachable by anything that could fire by
# accident. The `pypi` environment carries required reviewers, which puts a
# second, manual gate between the build and the upload.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which project to publish"
        required: true
        type: choice
        options:
          - trimitdown
          - trimitdown-pdf

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Publishing from a tree whose tests do not pass is the one mistake that cannot
      # be undone afterwards, so this is the same gate tests.yml runs -- including the
      # zero-skips check, which used to be missing here while the comment claimed "the
      # same portable suite". It was untrue in the one place where it is expensive: a
      # version number on PyPI burns forever.
      - name: Run the portable suite
        run: |
          # From the lock, not from requirements-dev.txt: this is the gate before
          # the one step that cannot be undone, and a freely resolved graph here
          # means the tests that pass are not the tests that will run next time.
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e . ./packages/trimitdown-pdf
          python -m pytest -m "not corpus" -rs --junitxml=report.xml
          python scripts/check_no_skips.py report.xml

      - name: Assemble the distributions to publish
        # Through the environment rather than a ${{ }} substitution: the substitution
        # expands into the script text before it runs, that is, before `case` gets a
        # chance to reject an unknown value.
        env:
          PACKAGE: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          case "$PACKAGE" in
            trimitdown)
              # Taken from the release, not rebuilt. The release run installed
              # these exact files into clean environments and converted a
              # document with them, and they were attached to the draft a human
              # then approved. Rebuilding here would publish bytes nobody has
              # ever run -- which is the whole thing being repaired.
              #
              # The checksums travelled beside the files, so verifying against
              # them catches a damaged download and nothing more. The chain that
              # matters is simply that these are the files, not new ones.
              version=$(python - <<'PY'
          import ast, pathlib
          tree = ast.parse(pathlib.Path("src/trimitdown/__init__.py").read_text(encoding="utf-8"))
          print(next(node.value.value for node in tree.body
                     if isinstance(node, ast.Assign) and node.targets[0].id == "__version__"))
          PY
              )
              mkdir -p dist
              gh release download "v$version" --dir dist \
                --pattern 'trimitdown-*.whl' \
                --pattern 'trimitdown-*.tar.gz' \
                --pattern 'SHA256SUMS'
              cd dist
              grep -E 'trimitdown-[0-9].*(\.whl|\.tar\.gz)$' SHA256SUMS > distributions.sha256
              test -s distributions.sha256 \
                || { echo "the release carries no distributions for v$version"; exit 1; }
              sha256sum -c distributions.sha256
              rm SHA256SUMS distributions.sha256
              cd ..
              ;;
            trimitdown-pdf)
              # Built here, and this is the exception rather than the rule: the
              # engine is a separate project on PyPI with its own version, and the
              # release pipeline cuts drafts for the application only. Nothing has
              # run these bytes before the upload. Named plainly so it is a known
              # gap rather than an oversight.
              python -m build --outdir dist packages/trimitdown-pdf
              ;;
            *)
              echo "unknown package $PACKAGE"; exit 1
              ;;
          esac
          python -m twine check --strict dist/*

      # The required reviewer approves the *publish* job without seeing the
      # artifacts, so state plainly here what they are about to release. A
      # version already on PyPI cannot be replaced, so a wrong number needs to
      # be caught at this line and not after the upload.
      - name: Report what would be published
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          {
            echo "### Ready to publish $PACKAGE"
            echo
            if [ "$PACKAGE" = "trimitdown" ]; then
              echo "These files come from the GitHub release. They were installed"
              echo "into clean environments and used to convert a document before"
              echo "the draft was attached, and they are the files you approved."
            else
              echo "These files were built in this run. The engine has no release"
              echo "draft of its own, so nothing has executed them yet."
            fi
            echo
            echo '```'
            ls -1 dist/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name registered with the publisher on pypi.org
    # exactly; a mismatch fails the OIDC exchange rather than publishing wrongly.
    environment: pypi
    permissions:
      # The only job that gets to mint an OIDC token. The build job above does
      # not need it and does not have it.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
