# Mirror of build-macos.yml for windows.spec. The build has to live in CI and not
# only on a developer's machine: a scoop manifest points at the artifact by URL and
# verifies its checksum, and a checksum from a hand-made build is vouched for by
# nothing.
name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets release.yml call this build instead of copying its steps.
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    # Explicit rather than the repository default: this build only needs to read code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # requirements.txt installs the engine NOT editable -- windows.spec relies on
      # that and fails on an editable install, because PyInstaller does not follow one
      # and would emit an .exe without the engine.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build app with PyInstaller
        run: pyinstaller windows.spec

      # A green build says nothing about the contents: a missing module gives an .exe
      # that starts and dies on the first PDF. The same set of checks as the macOS
      # job, and a test keeps the two equal.
      - name: Verify package contents are in the bundle
        shell: bash
        run: |
          grep -q "trimitdown_pdf" build/windows/Analysis-00.toc \
            || { echo "trimitdown_pdf missing from the bundle"; exit 1; }
          grep -Eq "'trimitdown(\.[A-Za-z_][A-Za-z0-9_]*)?'" build/windows/Analysis-00.toc \
            || { echo "trimitdown package missing from the bundle"; exit 1; }
          grep -q "tiktoken_cache" build/windows/Analysis-00.toc \
            || { echo "tiktoken cache missing from the bundle"; exit 1; }

      # The smoke document is built by the same generator as the suite's fixtures:
      # prose plus a real table, so the engine has to do its work. The module is
      # import-free -- a build job needs no dev dependencies.
      - name: Build the smoke document
        run: python -c "from tests.pdf_fixtures import ruled_table; open('smoke.pdf','wb').write(ruled_table())"

      # Same as the macOS job and for the same reason: the contents check above looks
      # at file names and cannot see that the process fails to start. Here the .exe
      # itself runs and converts a document.
      #
      # Start-Process rather than running it straight from the shell, and that is
      # load-bearing. A console=False .exe started FROM A CONSOLE inherits its handles,
      # so sys.stdout and sys.stderr are alive. A user double-clicks it: no console,
      # both are None, and uvicorn dies configuring logging because its handler writes
      # to stderr. A check that launches the .exe from bash cannot see the difference --
      # it was measuring conditions nobody runs the app in.
      #
      # The verdict comes from a file rather than from output for the same reason: a
      # process without a console has nowhere to write.
      - name: Smoke-launch the bundle the way a user does
        shell: pwsh
        env:
          TRIMITDOWN_SMOKE: smoke.pdf
          TRIMITDOWN_SMOKE_LOG: smoke.log
        run: |
          $app = Start-Process -FilePath ".\dist\TrimItDown-windows-x64.exe" `
                               -PassThru -Wait
          "exit status: $($app.ExitCode)"
          if (-not (Test-Path smoke.log)) {
            throw "the bundle produced no smoke log at all"
          }
          Get-Content smoke.log
          if ((Get-Content smoke.log | Select-Object -Last 1) -notmatch '^smoke ok:') {
            throw "the bundle did not complete a conversion"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: TrimItDown-windows-x64
          path: dist/TrimItDown-windows-x64.exe
