[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trimitdown"
# Единственный источник -- __version__ в модуле, читается статически через AST,
# без импорта: иначе в build-окружение потянулся бы markitdown.
dynamic = ["version"]
description = "Convert documents to LLM-ready markdown. Per-page checked PDF extraction with a review hand-off for scans, offline, no cloud."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergey Dreizin" }]
keywords = ["markdown", "pdf", "llm", "document-conversion", "cli"]
# Классификатор лицензии не добавлять: PEP 639 запрещает его вместе с
# выражением license = "MIT", setuptools>=77 падает.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    # Developers rather than desktop end users: what ships to PyPI is the CLI,
    # and the desktop app never arrives through pip at all -- it comes via
    # brew/scoop. The audience classifier naming desktop end users also happens
    # to contain a substring the PII guard treats as a user path; see .githooks.
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

# The PDF engine is pinned exactly, every other dependency is a range. The
# route in trimitdown.pdf_route keys on pdf-inspector's reason identifiers
# ("scanned", "invisible_text_layer", "suspected_garbled_text"), which upstream
# does not document; a range would let a rebuild pick up a renamed reason or a
# new way of emptying a page, silently. Raising it is its own commit, after the
# weekly pdf-inspector-latest canary has run the suite against the new version.
# FastAPI/uvicorn are NOT here: this is a CLI package, the web stack lives in
# the "server" extra.
dependencies = [
    "pdf-inspector==1.25.2",
    # The independent decoder the per-page gate measures pdf-inspector against,
    # and the text a page falls back to. [crypto] because AES-encrypted files
    # otherwise raise DependencyError; cryptography used to arrive only
    # transitively, through pdfminer, and reliability does not rest on that.
    "pypdf[crypto]>=6.1,<7",
    # Text-layer presence, page images for review and the page count. v4 and v5
    # differ in the render/extract API.
    "pypdfium2>=5,<6",
    # Writing page images: pypdfium2 hands out bitmaps through PIL, and every
    # scan codec except JPEG needs it to become a file an agent can read.
    "pillow>=10",
    # Same narrow extras as requirements.txt, and for the same reason recorded
    # there: the audio-transcription and Azure extras are heavy and useless
    # offline, which is what this package claims to be. "all" would pull an
    # Azure client into every install.
    "markitdown[docx,pdf,pptx,xlsx,xls,outlook]",
    "tiktoken",
    "python-pptx",
]

[project.optional-dependencies]
# Нужен только тому, кто поднимает HTTP-слой (Docker-образ, десктопная сборка).
server = ["fastapi", "uvicorn", "python-multipart"]

[project.scripts]
trimitdown = "trimitdown.cli:main"

[project.urls]
Homepage = "https://github.com/serjdrej/trimitdown"
Repository = "https://github.com/serjdrej/trimitdown"
Issues = "https://github.com/serjdrej/trimitdown/issues"

[tool.setuptools.dynamic]
version = { attr = "trimitdown.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Офлайн-кэш tiktoken. Без этой строки он не попадёт в wheel, и счёт токенов у
# установленного пакета молча уйдёт в сеть.
trimitdown = ["tiktoken_cache/*"]
